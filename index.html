<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rivaan Collection</title>
<style>
body{margin:0;font-family:Arial;background:#0b0b0b;color:#fff}
header{background:#000;padding:20px;text-align:center;border-bottom:2px solid gold}
h1{color:gold;margin:0}
.hero{padding:40px;text-align:center;background:#1a1a1a}
.hero h2{color:gold}
.section{padding:15px;color:gold}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.card{background:#1f1f1f;border-radius:15px;padding:10px}
.card img{width:100%;border-radius:10px}
.price{color:#00ff88;font-weight:bold}
.btn{display:block;text-align:center;background:#25D366;color:#fff;padding:10px;border-radius:8px;text-decoration:none;margin-top:8px}
</style>
</head>
<body>

<header>
  <h1>RIVAAN COLLECTION</h1>

</header>

<div class="hero">

</div>

<h2 class="section">⌚ Men's Watches</h2>
<div class="grid">
  <div class="card">
    <img src="images/135267.jpg">
    <h3>Rado Blue Jubilee</h3>
    <p class="price">₹1499</p>
    <a class="btn" href="https://wa.me/919409955512?text=Order Rado Blue Jubilee">Buy Now</a>
  </div>

  <div class="card">
    <img src="images/135268.jpg">
    <h3>Versace Black</h3>
    <p class="price">₹1699</p>
    <a class="btn" href="https://wa.me/919409955512?text=Order Versace Black">Buy Now</a>
  </div>
</div>

<h2 class="section">💖 Ladies' Watches</h2>
<div class="grid">

    <img src="images/135269.jpg">

    <a class="btn" href="https://wa.me/919409955512?text=Order Versace Gold">Buy Now</a>
  </div>

  <div class="card">
    <img src="images/135270.jpg">
    <h3>Versace Rose Gold</h3>
    <p class="price">₹1699</p>
    <a class="btn" href="https://wa.me/919409955512?text=Order Versace Rose Gold">Buy Now</a>
  </div>

  <div class="card">
    <img src="images/135271.jpg">
    <h3>Versace Silver Gold</h3>
    <p class="price">₹1699</p>
    <a class="btn" href="https://wa.me/919409955512?text=Order Versace Silver Gold">Buy Now</a>
  </div>
</div>

</body>
</html>
