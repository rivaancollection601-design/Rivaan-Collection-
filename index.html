<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rivaan Collection</title>
<style>
body{margin:0;font-family:Arial;background:#000;color:#fff}
header{background:#111;padding:15px;text-align:center;position:sticky;top:0}
.logo{color:#FFD700;font-size:28px;font-weight:bold}
.search{width:90%;padding:12px;border-radius:25px;border:none;margin-top:10px}
.hero{background:linear-gradient(#222,#000);padding:40px;text-align:center}
.hero h2{color:#FFD700;font-size:34px}
.section{color:#FFD700;padding:15px;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.card{background:#1b1b1b;border-radius:15px;padding:10px}
.card img{width:100%;border-radius:10px}
.price{color:#00ff88;font-weight:bold}
.btn{display:block;text-align:center;background:#25D366;color:#fff;padding:10px;border-radius:8px;text-decoration:none;margin-top:8px}
.whatsapp{position:fixed;bottom:20px;right:20px;background:#25D366;color:#fff;padding:15px;border-radius:50%;text-decoration:none;font-size:24px}
</style>
</head>
<body>

<header>
<div class="logo">RIVAAN COLLECTION</div>
<input class="search" placeholder="🔍 Search Watches">
</header>

<div class="hero">
<h2>Luxury Watch Collection</h2>
<p>Premium Watches For Men & Women</p>
</div>

<h2 class="section">⌚ Men's Watches</h2>
<div class="grid">
<div class="card"><img src="images/135267.jpg"><h3>Rado Blue Jubilee</h3><p class="price">₹1499</p><a class="btn" href="https://wa.me/919409955512?text=Order Rado Blue Jubilee">Buy Now</a></div>
<div class="card"><img src="images/135268.jpg"><h3>Versace Black</h3><p class="price">₹1699</p><a class="btn" href="https://wa.me/919409955512?text=Order Versace Black">Buy Now</a></div>
</div>

<h2 class="section">💖 Ladies' Watches</h2>
<div class="grid">
<div class="card"><img src="images/135269.jpg"><h3>Versace Gold</h3><p class="price">₹1699</p><a class="btn" href="https://wa.me/919409955512?text=Order Versace Gold">Buy Now</a></div>
<div class="card"><img src="images/135270.jpg"><h3>Versace Rose Gold</h3><p class="price">₹1699</p><a class="btn" href="https://wa.me/919409955512?text=Order Versace Rose Gold">Buy Now</a></div>
<div class="card"><img src="images/135271.jpg"><h3>Versace Silver Gold</h3><p class="price">₹1699</p><a class="btn" href="https://wa.me/919409955512?text=Order Versace Silver Gold">Buy Now</a></div>
</div>

<a class="whatsapp" href="https://wa.me/919409955512">💬</a>
<div id="lightbox" onclick="closeImg()" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000d;z-index:9999;justify-content:center;align-items:center;">
  <img id="showImg" style="max-width:95%;max-height:90%;border-radius:12px;">
</div>

<script>
function openImg(src){
  document.getElementById("showImg").src = src;
  document.getElementById("lightbox").style.display = "flex";
}
function closeImg(){
  document.getElementById("lightbox").style.display = "none";
}
</script>
</body>
</html>
